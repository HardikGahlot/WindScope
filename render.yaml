services:
  - type: web
    name: windscope-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PROJECT_NAME
        value: "WindScope — UK Wind Forecast Intelligence"
      - key: DEFAULT_CUTOFF_TIME
        value: "09:30"
      - key: DEFAULT_TIMEZONE
        value: "Europe/London"
      - key: CORS_ORIGINS
        value: "https://*.vercel.app,http://localhost:3000,http://localhost:5173"
